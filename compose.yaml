name: atlasrec
x-python: &python
  build:
    context: .
    dockerfile: services/api/Dockerfile
  env_file: .env
  volumes: [artifacts:/app/artifacts, data:/app/data]
  restart: unless-stopped
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: atlasrec
      POSTGRES_USER: atlasrec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlasrec -d atlasrec"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *python
    command: ["sh","-c","alembic upgrade head && exec uvicorn atlasrec_api.main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-1}"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30
  worker:
    <<: *python
    command: ["celery","-A","atlasrec_api.worker:celery","worker","--loglevel=INFO","--concurrency=1"]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    # Both loopbacks: Windows resolves "localhost" to ::1 first and otherwise waits ~2s
    # before falling back to IPv4 on every new connection.
    ports: ["127.0.0.1:3000:3000", "[::1]:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  tracking:
    <<: *python
    profiles: ["tracking"]
    command: ["mlflow","server","--host","0.0.0.0","--port","5000","--backend-store-uri","sqlite:////app/artifacts/mlflow.db","--default-artifact-root","/app/artifacts/mlruns"]
volumes:
  postgres: {}
  redis: {}
  artifacts: {}
  data: {}
