[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlasrec"
version = "0.1.0"
description = "CPU-first recommendation engineering portfolio"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.142.2", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.3", "alembic==1.20.0", "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0", "argon2-cffi==25.1.0", "redis==8.1.0", "celery==5.6.3", "numpy==2.5.3", "scipy==1.18.1",
  "pandas==3.0.6", "scikit-learn==1.9.1", "torch==2.14.1+cpu", "lightgbm==4.7.0", "faiss-cpu==1.15.1", "mlflow==3.16.1", "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10"]

[project.scripts]
atlasrec = "atlasrec_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/ml/atlasrec_ml", "services/api/atlasrec_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/ml", "services/api"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff.lint.per-file-ignores]
"scripts/test_server.py" = ["E402"]

