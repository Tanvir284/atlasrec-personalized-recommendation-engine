name: correctness
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_DB: atlasrec_test, POSTGRES_USER: atlasrec, POSTGRES_PASSWORD: test-password}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U atlasrec -d atlasrec_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      ATLASREC_ENV: test
      DATABASE_URL: postgresql+psycopg://atlasrec:test-password@localhost:5432/atlasrec_test
      ATLASREC_TEST_DATABASE_URL: postgresql+psycopg://atlasrec:test-password@localhost:5432/atlasrec_test
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.11.4", python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "24.11.0", cache: npm}
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run alembic upgrade head
      - run: python scripts/manage.py verify
      - run: uv run atlasrec train --config configs/benchmark.yaml
      - run: npx playwright install --with-deps chromium
      - run: |
          uv run python scripts/test_server.py > api.log 2>&1 &
          npm run dev > web.log 2>&1 &
          uv run python scripts/wait_ready.py
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            docs/evidence
            test-results
            api.log
            web.log
